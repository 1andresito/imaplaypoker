name: Test & build desktop apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Third-party actions are pinned to commit SHAs: a moved tag can't change what runs
# in a job that holds the release token and the update signing key.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    # Needed to create releases and upload installers.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # `label` goes into the release file names (e.g. imaplaypoker_0.3.0_Fedora.rpm) so
      # people can spot their download. Linux builds once per package type, because the
      # name pattern can't tell .deb from .rpm within a single job.
      matrix:
        include:
          - platform: windows-latest
            args: ""
            label: Windows
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            label: macOS-Apple-Silicon
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            label: macOS-Intel
          - platform: ubuntu-22.04
            args: ""
            bundles: deb
            label: Debian-Ubuntu
          - platform: ubuntu-22.04
            args: ""
            bundles: rpm
            label: Fedora
          - platform: ubuntu-22.04
            args: ""
            bundles: appimage
            label: Linux-AppImage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      # Updates are signed with the key in the TAURI_SIGNING_PRIVATE_KEY secret. Without
      # it, build normally but skip the update files (installers still work).
      # Pull requests never get the key: their code hasn't been reviewed yet.
      - name: Check for update signing key
        id: signing
        shell: bash
        env:
          KEY: ${{ github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
        run: |
          if [ -n "$KEY" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "args=--config src-tauri/tauri.no-updater.conf.json" >> "$GITHUB_OUTPUT"
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set, so this build has no auto-update files."
          fi
      # On a version tag (e.g. v0.2.0) this publishes a GitHub release with the installers
      # and latest.json, which installed copies of the game check for updates.
      # Otherwise the installers are uploaded as workflow artifacts.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          args: ${{ matrix.args }} ${{ matrix.bundles && format('--bundles {0}', matrix.bundles) || '' }} ${{ steps.signing.outputs.args }}
          # [ext] includes its dot and covers signatures too (.deb.sig), so updates still match.
          assetNamePattern: "[name]_[version]_${{ matrix.label }}[setup][ext]"
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "imaplaypoker ${{ github.ref_name }}"
          releaseBody: |
            Download the file for your system below:

            - **Windows:** `_Windows-setup.exe` (or the `.msi`)
            - **Mac:** `_macOS-Apple-Silicon.dmg` for M1 and newer, `_macOS-Intel.dmg` for older Macs
            - **Debian, Ubuntu, Mint:** `_Debian-Ubuntu.deb`
            - **Fedora, RHEL, openSUSE:** `_Fedora.rpm`
            - **Any other Linux:** `_Linux-AppImage.AppImage`

            Ignore the `.sig`, `.tar.gz` and `latest.json` files: they're for automatic updates. If you already have imaplaypoker 0.2.0 or newer, it will offer this update automatically.
          releaseDraft: false
          includeUpdaterJson: true
      # Build logs need a GitHub login, but annotations are public: surface the Rust
      # error on the run's summary page so failures can be diagnosed from anywhere.
      - name: Show Rust build error
        if: failure()
        shell: bash
        working-directory: src-tauri
        run: |
          # Annotations are one line: escape % and join lines with %0A.
          out=$(cargo build --release ${{ matrix.args }} 2>&1 | grep -E -A15 '^error' | head -80 \
            | awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }' || true)
          echo "::error title=Rust build error::${out:-No Rust error found; see the tauri-action step log.}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.platform }}-${{ strategy.job-index }}
          path: |
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
          if-no-files-found: ignore
