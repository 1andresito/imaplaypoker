[package]
name = "imaplaypoker"
version = "0.2.0"
description = "Learn poker by playing it"
authors = ["andresito"]
license = "MIT"
edition = "2021"

[lib]
name = "imaplaypoker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-process = "2"
tokio = { version = "1.53.3", features = ["net", "time", "sync", "macros", "io-util", "rt"] }
spake2 = "0.4.0"
chacha20poly1305 = "0.11.0"
hkdf = "0.13.0"
hmac = "0.13.0"
sha2 = "0.11.1"
if-addrs = "0.15.0"
getrandom = "0.4.3"

# Auto-update is desktop-only.
# The default `zip` feature only handles the legacy (v1) update formats, which this
# app doesn't publish, and its `zip` dependency has had almost every release yanked
# from crates.io (security fixes), so it's turned off.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread"] }
